worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=100r/m;

    # Upstream services
    upstream gym_api {
        server gym-api:9090;
        keepalive 32;
    }

    upstream gym_web {
        server gym-web:3000;
        keepalive 16;
    }

    upstream gym_rabbitmq {
        server rabbitmq:15672;
        keepalive 8;
    }

    # ── HTTP → HTTPS redirect ──────────────────────────────
    server {
        listen 80;
        server_name gym.hexalyte.com api.gym.hexalyte.com rabbitmq.gym.hexalyte.com;
        return 301 https://$host$request_uri;
    }

    # ── SSL settings (shared) ─────────────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Frontend ── https://gym.hexalyte.com ─────────────
    server {
        listen 443 ssl;
        server_name gym.hexalyte.com;

        ssl_certificate     /etc/letsencrypt/live/gym.hexalyte.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gym.hexalyte.com/privkey.pem;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            proxy_pass http://gym_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ── API ── https://api.gym.hexalyte.com ──────────────
    server {
        listen 443 ssl;
        server_name api.gym.hexalyte.com;

        ssl_certificate     /etc/letsencrypt/live/gym.hexalyte.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gym.hexalyte.com/privkey.pem;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://gym_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        location /api/v1/billing/payhere/notify {
            limit_req zone=webhook burst=50 nodelay;
            proxy_pass http://gym_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /actuator/health {
            proxy_pass http://gym_api;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }
    }

    # ── RabbitMQ ── https://rabbitmq.gym.hexalyte.com ────
    server {
        listen 443 ssl;
        server_name rabbitmq.gym.hexalyte.com;

        ssl_certificate     /etc/letsencrypt/live/gym.hexalyte.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gym.hexalyte.com/privkey.pem;

        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            proxy_pass http://gym_rabbitmq;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
